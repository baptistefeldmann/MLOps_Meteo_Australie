services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: bash /init.sh
    env_file:
      - .env

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
    command: airflow webserver
    env_file:
      - .env

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    # GID of the host group that owns /var/run/docker.sock (docker group).
    # Grants the in-container `airflow` user access to the Docker socket so
    # the DockerOperator tasks can spawn containers. Find yours with:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    command: airflow scheduler
    env_file:
      - .env

  training:
    build:
      context: .
      dockerfile: src/training/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: bash src/pipelines/pipeline_training.sh
    env_file:
      - .env

  predict:
    build:
      context: .
      dockerfile: src/prediction/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python -m src.data.collect_inference --city ${CITY:-Sydney} && python -m src.models.predict --city ${CITY:-Sydney}
    env_file:
      - .env

  drift:
    # Reutilise l'image du service `training` (meme Dockerfile) : evite de
    # reconstruire ~3 Go et garantit des versions de librairies identiques.
    # Prerequis sur un clone neuf : docker compose build training
    image: mlops_meteo_australie-training
    volumes:
      - .:/app
    working_dir: /app
    command: python -m src.monitoring.drift_report
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: src/api/Dockerfile.nginx
    ports:
      - "8000:80"
    environment:
      - API_KEY
    depends_on:
      - api

  interface:
    build:
      context: .
      dockerfile: src/interface/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    working_dir: /app
    env_file:
      - .env

  # UI Evidently : sert les snapshots de drift ecrits par src/monitoring/drift_report.py
  # dans reports/evidently_workspace. Port interne 8000 -> 8888 sur l'hote
  # (8000 est deja pris par nginx).
  evidently-ui:
    # Reutilise l'image du service `training` (meme Dockerfile) : evite de
    # reconstruire ~3 Go et garantit des versions de librairies identiques.
    # Prerequis sur un clone neuf : docker compose build training
    image: mlops_meteo_australie-training
    volumes:
      - .:/app
    working_dir: /app
    command: evidently ui --host 0.0.0.0 --port 8000 --workspace reports/evidently_workspace
    ports:
      - "8888:8000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      
volumes:
  postgres_db:
  prometheus_data:
  grafana_data:

