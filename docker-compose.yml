services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: bash /init.sh
    env_file:
      - .env

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
    command: airflow webserver
    env_file:
      - .env

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler
    env_file:
      - .env


  training:
    build:
      context: .
      dockerfile: src/training/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: bash src/pipelines/pipeline_training.sh
    env_file:
      - .env

  predict:
    build:
      context: .
      dockerfile: src/prediction/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python -m src.data.collect_inference --city ${CITY:-Sydney} && python -m src.models.predict --city ${CITY:-Sydney}
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    working_dir: /app
    env_file:
      - .env

  interface:
    build:
      context: .
      dockerfile: src/interface/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    working_dir: /app
    env_file:
      - .env

volumes:
  postgres_db:

